name: Release (Windows and Linux)

# The Mac build is made locally (scripts/release-mac.sh) so it can be signed
# and notarized. This builds Windows and Linux and attaches them to a release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the builds to (for example v0.1.0)
        required: true
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev
      - run: npm ci
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: npx tauri build --bundles nsis
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: npx tauri build --bundles appimage,deb
      - name: Attach to the release (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cp src-tauri/target/release/bundle/nsis/*-setup.exe Kiln-Setup.exe
          sha256sum Kiln-Setup.exe > Kiln-Setup.exe.sha256
          gh release upload "$TAG" Kiln-Setup.exe Kiln-Setup.exe.sha256 --clobber
      - name: Attach to the release (Linux)
        if: runner.os == 'Linux'
        run: |
          cp src-tauri/target/release/bundle/appimage/*.AppImage Kiln-x86_64.AppImage
          cp src-tauri/target/release/bundle/deb/*.deb Kiln-amd64.deb
          sha256sum Kiln-x86_64.AppImage Kiln-amd64.deb > Kiln-linux.sha256
          gh release upload "$TAG" Kiln-x86_64.AppImage Kiln-amd64.deb Kiln-linux.sha256 --clobber
