# Checks and builds Kiln on macOS (Apple silicon and Intel), Windows and Linux.
# Nothing is signed, notarized or published here: the bundles are uploaded as workflow
# artifacts. Signed Mac releases come from `npm run release:mac` (see docs/BUILDING.md).
name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
            artifact: kiln-macos-aarch64
            # the runner is Apple silicon, so the Rust tests run in this job only
            test: true
            bundles: |
              src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - name: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
            artifact: kiln-macos-x86_64
            test: false
            bundles: |
              src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: ''
            artifact: kiln-windows-x86_64
            test: true
            bundles: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe
          - name: Linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ''
            artifact: kiln-linux-x86_64
            test: true
            bundles: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/rpm/*.rpm

    steps:
      - uses: actions/checkout@v4

      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install npm packages
        run: npm ci

      - name: Type-check
        run: npx tsc -b

      - name: Lint
        run: npx oxlint src

      # unix-only tests are behind #[cfg(unix)], so Windows runs the rest
      - name: Rust tests
        if: matrix.test
        working-directory: src-tauri
        run: cargo test --lib

      # tauri.conf.json names a Developer ID; CI has no certificates, so sign ad hoc ("-")
      # instead. That keeps the Apple silicon build launchable without a paid identity.
      - name: Unsigned Mac build config
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo '{ "bundle": { "macOS": { "signingIdentity": "-", "hardenedRuntime": false } } }' > "$RUNNER_TEMP/unsigned-mac.json"
          echo "MAC_CONFIG=--config $RUNNER_TEMP/unsigned-mac.json" >> "$GITHUB_ENV"

      # No tagName / releaseId, so tauri-action only builds; it publishes nothing.
      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.args }} ${{ env.MAC_CONFIG }}

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error
          retention-days: 14
